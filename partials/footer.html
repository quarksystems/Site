<!-- JS para animar el glow/deslumbre -->
<script>
  // Año dinámico
  document.getElementById('year').textContent = new Date().getFullYear();

  // Glow animado en la firma
  const firma = document.getElementById('firma-quark');
  let glowOn = false;
  setInterval(() => {
    glowOn = !glowOn;
    if (glowOn) {
      firma.classList.add('glow-anim');
    } else {
      firma.classList.remove('glow-anim');
    }
  }, 3200); // cada 3.2 segundos
</script>

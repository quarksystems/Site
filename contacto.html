<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacto | Quark‑Systems.ar</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div id="header"></div>
  <main class="container narrow">
    <!-- Logo alternativo con efecto glow -->
    <img src="/assets/img/logo-alt.png" alt="Quark-Systems Logo Alternativo" class="logo-glow" />
    <h1 style="text-align:center; margin-bottom:.5rem;">¿Hablamos?</h1>
    <p style="text-align:center; color:#0d2a45; margin-bottom:2rem;">
      Te respondemos rápido y con soporte real.<br>
      <span class="badge">Automatización sin vueltas</span> · <span class="badge">Resultados con respaldo</span>
    </p>
    <form class="contact-form" id="contactForm" novalidate>
      <label for="name">Nombre y empresa
        <input type="text" id="name" name="name" required minlength="3" placeholder="Ej: Ana — Fábrica XYZ" />
      </label>
      <label for="email">Email
        <input type="email" id="email" name="email" required placeholder="nombre@empresa.com" />
      </label>
      <label for="phone">Teléfono
        <input type="tel" id="phone" name="phone" pattern="^[0-9+()\\s-]{7,}$" placeholder="+54 341 ..." />
      </label>
      <label for="topic">¿Qué necesitás?
        <select id="topic" name="topic" required>
          <option value="" selected disabled>Selecciona</option>
          <option>PLC</option>
          <option>HMI</option>
          <option>VFD</option>
          <option>IIoT</option>
          <option>Proyecto llave en mano</option>
          <option>Capacitación</option>
          <option>Otro</option>
        </select>
      </label>
      <label for="message">Mensaje
        <textarea id="message" name="message" required rows="5" placeholder="Cuéntanos la aplicación, potencia, protocolo, etc."></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Enviar</button>
      <p class="form-feedback" role="status" aria-live="polite"></p>
    </form>
    <div class="contact-data" style="margin-top:2rem;">
      <h2>También puedes escribirnos</h2>
      <p><strong>Email:</strong> hola@quark-systems.ar</p>
      <p><strong>Ubicación:</strong> Cordón Industrial San Lorenzo, Santa Fe</p>
      <p><strong>Teléfono:</strong> (0341) 6594559</p>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/assets/js/includes.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    // Validación simple con efecto feedback
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('contactForm');
      if(!form) return;
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const feedback = form.querySelector('.form-feedback');
        if (!form.checkValidity()){
          feedback.textContent = 'Revisa los campos requeridos.';
          form.reportValidity();
          return;
        }
        feedback.textContent = '¡Gracias! Te contactamos a la brevedad.';
        form.reset();
      });
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacto | Quark‑Systems.ar</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div id="header"></div>
  <main class="container narrow">
    <h1>Contactanos</h1>
    <form class="contact-form" id="contactForm" novalidate>
      <label>Nombre y empresa
        <input type="text" name="name" required minlength="3" placeholder="Ej: Ana — Fábrica XYZ" />
      </label>
      <label>Email
        <input type="email" name="email" required placeholder="nombre@empresa.com" />
      </label>
      <label>Teléfono
        <input type="tel" name="phone" pattern="^[0-9+()\\s-]{7,}$" placeholder="+54 341 ..." />
      </label>
      <label>¿Qué necesitás?
        <select name="topic" required>
          <option value="" selected disabled>Seleccioná</option>
          <option>PLC</option><option>HMI</option><option>VFD</option>
          <option>IIoT</option><option>Proyecto llave en mano</option>
          <option>Otro</option>
        </select>
      </label>
      <label>Mensaje
        <textarea name="message" required rows="5" placeholder="Contanos la aplicación, potencia, protocolo, etc."></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Enviar</button>
      <p class="form-feedback" role="status" aria-live="polite"></p>
    </form>
    <div class="contact-data">
      <h2>También podés escribirnos</h2>
      <p><strong>Email:</strong> hola@quark-systems.ar (editar)</p>
      <p><strong>Ubicación:</strong> Pto. Gral. San Martín, Santa Fe</p>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/assets/js/includes.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    // Validación simple
    (function(){
      const form = document.getElementById('contactForm');
      if(!form) return;
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!form.checkValidity()){
          form.querySelector('.form-feedback').textContent = 'Revisá los campos requeridos.';
          form.reportValidity();
          return;
        }
        form.querySelector('.form-feedback').textContent = '¡Gracias! Te contactamos a la brevedad.';
        form.reset();
      });
    })();
  </script>
</body>
</html>
